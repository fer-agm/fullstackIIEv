<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario | Level-Up Gamer</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header></header>

    <div class="container" style="max-width: 600px;">
        <div class="card">
            <h2>Registro de Usuario</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 1rem;">
                * Requisito: Solo mayores de 18 años. Usa tu correo @duoc.cl para obtener un 20% de descuento de por vida.
            </p>

            <form id="reg-form">
                <label>Nombre Completo:</label>
                <input type="text" id="reg-name" required>

                <label>Correo Electrónico:</label>
                <input type="email" id="reg-email" required placeholder="ejemplo@duoc.cl">

                <label>Contraseña:</label>
                <input type="password" id="reg-pass" required>

                <label>Edad (Años):</label>
                <input type="number" id="reg-age" required min="1">

                <label>Código de Referido (Opcional):</label>
                <input type="text" id="reg-ref" placeholder="Ej: REF123">

                <button type="submit" class="btn-green" style="margin-top: 1.5rem; width: 100%;">Crear Cuenta</button>
            </form>
        </div>
    </div>
    <footer>    </footer>
    
    <script src="funciones.js"></script>
    <script>
        document.getElementById('reg-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const age = parseInt(document.getElementById('reg-age').value);
            const ref = document.getElementById('reg-ref').value;

            if (registerUserLogic(name, email, pass, age, ref)) {
                window.location.href = 'inicioSesion.html';
            }
        });
    </script>
</body>

</html>
