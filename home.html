<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio | Level-Up Gamer</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header></header>

    <div class="container">
        <!-- Hero Section -->
        <div class="card" style="text-align: center; padding: 2.5rem 1rem;">
            <h1>¡Desafía tus límites con Level-Up Gamer!</h1>
            <p style="color: var(--text-sub); margin: 1rem 0;">
                Tu tienda online líder en productos gamer en Chile.
            </p>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px;">
                <a href="productos.html" class="btn-green">Ver Catálogo Completo</a>
                <a href="inicioSesion.html" class="btn-blue">🔐 Iniciar Sesión / Admin</a>
                <a href="registroUsuario.html" class="btn-blue" style="background:#444;">Registrarse (20% Desc. Duoc)</a>
            </div>
        </div>

        <div class="card">
            <h2>Productos Destacados</h2>
            <div class="grid-products" id="featured-products"></div>
        </div>
    </div>
    <footer>    </footer>

    <script src="funciones.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('featured-products');
            const products = getProducts();

            if (!products || products.length === 0) {
                container.innerHTML = '<p style="color:var(--text-sub)">Cargando productos...</p>';
                return;
            }

            container.innerHTML = '';
            products.slice(0, 6).forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="assets/img/${p.image || 'placeholder.png'}" 
                             alt="${p.name}" 
                             onerror="this.src='https://via.placeholder.com/200x180/111/39FF14?text=Sin+Imagen'">
                        <div>
                            <h4>${p.name}</h4>
                            <div class="product-meta">Cod: ${p.code} | ${p.category}</div>
                            <div class="product-price">$${p.price.toLocaleString('es-CL')} CLP</div>
                            <p style="font-size:0.85rem; color:var(--text-sub);">${p.desc.substring(0, 70)}...</p>
                        </div>
                        <div style="margin-top:1rem; display:flex; flex-direction:column; gap:0.5rem;">
                            <a href="detalleProducto.html?code=${p.code}" class="btn-blue" style="text-align:center;">Ver Detalle</a>
                            <button onclick="addToCart('${p.code}'); window.location.href='productoCompra.html';" class="btn-green">Comprar Ahora</button>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
